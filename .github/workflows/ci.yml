name: CI

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - java: '21'
            spring-boot: '3.4.1'
          - java: '21'
            spring-boot: '3.3.7'

    name: Java ${{ matrix.java }} / Spring Boot ${{ matrix.spring-boot }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'corretto'
          cache: maven

      - name: Build and test
        run: mvn clean verify --batch-mode --no-transfer-progress -Dspring-boot.version=${{ matrix.spring-boot }}

      - name: Upload coverage report
        if: matrix.spring-boot == '3.4.1'
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14

  dependency-check:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: maven

      - name: Check for dependency updates
        run: mvn versions:display-dependency-updates --batch-mode --no-transfer-progress | grep -E "^\[INFO\].*->" || true
