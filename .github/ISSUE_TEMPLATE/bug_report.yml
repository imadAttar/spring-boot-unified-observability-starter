name: Bug Report
description: Report a bug in the observability starter
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Starter Version
      placeholder: "1.3.0"
    validations:
      required: true
  - type: input
    id: spring-boot-version
    attributes:
      label: Spring Boot Version
      placeholder: "3.4.1"
    validations:
      required: true
  - type: input
    id: java-version
    attributes:
      label: Java Version
      placeholder: "21"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect?
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Relevant `observability.*` properties from your application.yml
      render: yaml
  - type: textarea
    id: stacktrace
    attributes:
      label: Stack trace / logs
      render: text
