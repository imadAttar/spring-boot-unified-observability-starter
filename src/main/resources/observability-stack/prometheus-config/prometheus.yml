# Prometheus Configuration for Spring Boot Unified Observability Starter

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'spring-boot-observability'
    cluster: 'local'

# Alertmanager (enable with: docker compose --profile alerting up -d)
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - 'alertmanager:9093'

# Alert rules
rule_files:
  - '/etc/prometheus/rules/*.yml'

# Scrape configuration
scrape_configs:

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # Spring Boot application
  # Adjust the target to match your setup:
  #   Docker (Mac/Windows): host.docker.internal:8080
  #   Docker (Linux):       172.17.0.1:8080
  #   Kubernetes:           my-service.default.svc:8080
  #   Local (no Docker):    localhost:8080
  - job_name: 'spring-boot-demo'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          service: 'demo-app'
          application: 'demo-observability-app'
          environment: 'development'
          team: 'platform'

  # Additional Spring Boot instances (uncomment and adjust)
  # - job_name: 'my-other-service'
  #   metrics_path: '/actuator/prometheus'
  #   static_configs:
  #     - targets: ['host.docker.internal:8081']
  #       labels:
  #         service: 'my-other-service'
  #         environment: 'development'
